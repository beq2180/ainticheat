# Merge this section into config/paper-world-defaults.yml under the existing world defaults.
# This is intended to work alongside AegisAC's heuristic X-Ray alerts.
# Restart Paper after changing it; /reload is not enough for Anti-Xray config changes.

anticheat:
  anti-xray:
    enabled: true
    engine-mode: 2
    lava-obscures: false
    max-block-height: 64
    update-radius: 2
    use-permission: false
    hidden-blocks:
      - copper_ore
      - deepslate_copper_ore
      - raw_copper_block
      - diamond_ore
      - deepslate_diamond_ore
      - gold_ore
      - deepslate_gold_ore
      - iron_ore
      - deepslate_iron_ore
      - raw_iron_block
      - lapis_ore
      - deepslate_lapis_ore
      - redstone_ore
      - deepslate_redstone_ore
    replacement-blocks:
      - chest
      - amethyst_block
      - andesite
      - budding_amethyst
      - calcite
      - coal_ore
      - deepslate_coal_ore
      - deepslate
      - diorite
      - dirt
      - emerald_ore
      - deepslate_emerald_ore
      - granite
      - gravel
      - oak_planks
      - smooth_basalt
      - stone
      - tuff
