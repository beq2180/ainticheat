# AegisAC 1.0.0 - Paper 1.21.11
# Conservative defaults are intentional: obvious cheats are blocked quickly,
# while noisier heuristic checks need several violations before intervention.

settings:
  alert-min-vl: 1.0
  alert-cooldown-ms: 900
  violation-decay-per-second: 0.12
  teleport-grace-ms: 1200
  velocity-grace-ms: 900
  low-tps-threshold: 18.0
  low-tps-max-multiplier: 1.45

checks:
  speed:
    enabled: true
    cancel-vl: 3.0
    setback-vl: 4.0
  fly:
    enabled: true
    cancel-vl: 3.0
    setback-vl: 4.0
  noclip:
    enabled: true
    cancel-vl: 1.5
    setback-vl: 2.0
  timer:
    enabled: true
    cancel-vl: 5.0
    setback-vl: 7.0

  reach:
    enabled: true
    cancel-vl: 2.5
  killaura:
    enabled: true
    cancel-vl: 4.0
  autoclicker:
    enabled: true
    cancel-vl: 6.0

  fastbreak:
    enabled: true
    cancel-vl: 3.0
  nuker:
    enabled: true
    cancel-vl: 2.0
  scaffold:
    enabled: true
    cancel-vl: 5.0

  antikb:
    enabled: true
    reapply-vl: 3.0
  xray:
    enabled: true
    # Heuristic only. It alerts staff; Paper's native Anti-Xray should do the actual obfuscation.
    alert-score: 8.0

punishments:
  # Prevention (cancel/setback/reapply KB) works even when this is false.
  # Leave automatic commands off until you've tuned the checks on your server.
  enabled: false
  global-vl-cooldown-ms: 15000
  commands:
    '30': 'kick %player% Unfair advantage detected by AegisAC.'

messages:
  prefix: '&8[&bAegisAC&8]&r '
  no-permission: '&cYou do not have permission.'
  alerts-on: '&aAnti-cheat alerts enabled.'
  alerts-off: '&7Anti-cheat alerts disabled.'
